spring.application.name=notetrail
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:notetrail}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:notetrail}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:change-me}
app.ratelimit.login-capacity=${LOGIN_RATE_LIMIT:5}
