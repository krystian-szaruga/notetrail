name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SPRING_APPLICATION_JSON: >-
        {"logging":{"level":{"org.hibernate.SQL":"DEBUG","org.hibernate.orm.jdbc.bind":"TRACE","org.springframework.transaction":"TRACE","org.hibernate.tool.schema":"DEBUG","org.springframework.web.servlet.DispatcherServlet":"DEBUG"}}}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        working-directory: infra
        run: |
          root_password=$(openssl rand -hex 16); echo "::add-mask::$root_password"
          user_password=$(openssl rand -hex 16); echo "::add-mask::$user_password"
          jwt_secret=$(openssl rand -hex 32); echo "::add-mask::$jwt_secret"
          sed \
            -e "s/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=$root_password/" \
            -e "s/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=$user_password/" \
            -e "s/^JWT_SECRET=.*/JWT_SECRET=$jwt_secret/" \
            .env.example > .env

      - name: Start stack
        working-directory: infra
        run: docker compose up -d --build --wait

      - name: Warm up
        run: |
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/register || true)
            if [ "$code" = "405" ]; then break; fi
            sleep 2
          done
          test "$code" = "405"

      - name: Smoke test
        run: bash ./.github/scripts/smoke-test.sh

      - name: Logs
        if: failure()
        working-directory: infra
        run: docker compose logs

      - name: Stop stack
        if: always()
        working-directory: infra
        run: docker compose down -v
